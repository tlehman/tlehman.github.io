<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$</title>
    <!-- Link previews (X, iMessage, etc.), filled in by social-card.lua -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Tobi's writing">
    <meta property="og:title" content="$if(card_title)$$card_title$$else$$title$$endif$">
$if(card_url)$
    <meta property="og:url" content="$card_url$">
    <link rel="canonical" href="$card_url$">
$endif$
$if(card_description)$
    <meta name="description" content="$card_description$">
    <meta property="og:description" content="$card_description$">
    <meta name="twitter:description" content="$card_description$">
$endif$
    <meta name="twitter:title" content="$if(card_title)$$card_title$$else$$title$$endif$">
$if(card_image)$
    <meta property="og:image" content="$card_image$">
    <meta name="twitter:image" content="$card_image$">
    <meta name="twitter:card" content="summary_large_image">
$else$
    <meta property="og:image" content="https://tobilehman.com/img/android-chrome-512x512.png">
    <meta name="twitter:card" content="summary">
$endif$
    <link rel="stylesheet" href="/writing/blog-style-2d477e19bcef198aecf876e3c8f68c12.css">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/img/android-chrome-512x512.png">
    <link rel="stylesheet" href="/writing/darkmode.css">
    <script src="/writing/darkmode.js"></script>
    <link rel="stylesheet" href="/writing/annotations.css">
    <script src="/writing/annotations.js" defer></script>
$if(math)$
    $math$
    <script>
    // Runs after the KaTeX render above (listeners fire in order). An inline
    // formula wider than its paragraph becomes a sideways-scrolling block
    // (.math-wide in blog-style.css) instead of pushing past the page edge.
    document.addEventListener("DOMContentLoaded", function () {
        function fit() {
            document.querySelectorAll(".math.inline").forEach(function (el) {
                el.classList.remove("math-wide");
                var box = el.parentElement.getBoundingClientRect();
                if (el.getBoundingClientRect().right > box.right + 1) el.classList.add("math-wide");
            });
        }
        fit();
        if (document.fonts) document.fonts.ready.then(fit);
        window.addEventListener("resize", fit);
    });
    </script>
$endif$
</head>
<body>
    <nav style="display: flex; align-items: center; gap: 10px; margin-bottom: 1em;">
        <a href="/writing/"><img src="/img/android-chrome-192x192.png" alt="logo" style="height: 32px; width: 32px;"></a>
        <a href="/writing/" style="font-size: 1.4em; font-weight: 600; text-decoration: none; color: #000;">Tobi's writing</a>
        <a href="/" style="margin-left: auto; text-decoration: none; color: #000;">Home</a>
        <button class="darkmode-toggle">Dark</button>
    </nav>
    <small>$date$</small>
    <h1>$title$</h1>
$body$
<form
  action="https://buttondown.com/api/emails/embed-subscribe/tobilehman"
  method="post"
  class="embeddable-buttondown-form subscribe-form"
>
  <label for="bd-email">Subscribe to TobiLehman.com</label>
  <input type="email" name="email" id="bd-email" />
  <input type="submit" value="Subscribe" />
  <p>
    <a href="https://buttondown.com/refer/tobilehman" target="_blank">
      Powered by Buttondown.
    </a>
  </p>
</form>
<script data-goatcounter="https://tobilehman.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
